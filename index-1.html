<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAN Graphic Store - Premium Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg-dark: #0a0b10;
            --accent: #0ff; 
            --accent-glow: rgba(0, 255, 255, 0.4);
            --card-bg: rgba(255, 255, 255, 0.03); 
            --card-border: rgba(255, 255, 255, 0.08); 
            --gold: #f1c40f; 
            --wa: #25D366; 
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-dark); 
            color: #fff; 
            overflow-x: hidden; 
            position: relative;
            user-select: none; /* Prevents text selection/copying */
            -webkit-user-select: none;
        }

        /* Ambient Background Glows */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }
        body::before { top: -10%; left: -10%; }
        body::after { bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(241, 196, 15, 0.1) 0%, rgba(0,0,0,0) 70%); animation-delay: -6s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.2); }
        }

        .topbar { 
            display: flex; 
            justify-content: space-between; 
            padding: 15px 40px; 
            background: rgba(10, 11, 16, 0.8); 
            border-bottom: 1px solid var(--card-border); 
            align-items: center; 
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 10;
        }

        .header { 
            text-align: center; 
            padding: 80px 20px 40px 20px; 
            position: relative;
        }
        .header h1 { 
            color: #fff; 
            font-size: 4em; 
            font-weight: 900;
            text-transform: uppercase; 
            margin: 0; 
            letter-spacing: 2px;
            background: linear-gradient(45deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0,255,255,0.2); 
        }
        .header p {
            color: #8a8f98;
            font-size: 1.2em;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        nav { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            background: rgba(10, 11, 16, 0.7); 
            padding: 20px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid var(--card-border);
        }
        nav button { 
            background: rgba(255,255,255,0.02); 
            border: 1px solid var(--card-border); 
            color: #fff; 
            font-weight: 600; 
            padding: 12px 28px; 
            cursor: pointer; 
            border-radius: 12px; 
        }
        nav button:hover { 
            background: #fff; 
            color: #000; 
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .tab-section { display: none; padding: 40px 20px; max-width: 1200px; margin: auto; }
        .active { display: block; animation: fadeIn 0.5s ease-in-out forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-tabs { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-bottom: 50px; 
        }
        .img-tab { 
            position: relative; 
            height: 130px; 
            border-radius: 16px; 
            overflow: hidden; 
            cursor: pointer; 
            border: 1px solid var(--card-border); 
            background: #000;
        }
        .img-tab img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: brightness(0.3) grayscale(0.5); 
            transition: 0.5s ease;
        }
        .img-tab span { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-weight: 700; 
            font-size: 1.1em;
            text-align: center; 
            width: 100%; 
            z-index: 2; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .img-tab:hover img { filter: brightness(0.5) scale(1.05); }
        .img-tab.active-sub { 
            border-color: var(--accent); 
            box-shadow: 0 0 25px var(--accent-glow); 
        }
        .img-tab.active-sub img { filter: brightness(0.6) grayscale(0); }

        .cards-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
        }
        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid var(--card-border); 
            text-align: center; 
            backdrop-filter: blur(10px);
        }
        .card:hover {
            border-color: rgba(0, 255, 255, 0.3);
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0, 255, 255, 0.05);
        }
        .card img, .card video { 
            width: 100%; 
            border-radius: 14px; 
            height: 200px; 
            object-fit: cover; 
            margin-bottom: 15px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card h3 { margin: 10px 0; font-size: 1.3em; font-weight: 600; }
        .price-tag { 
            color: var(--gold); 
            font-weight: 700; 
            font-size: 1.3em; 
            display: block; 
            margin: 10px 0; 
            white-space: pre-line; 
        }
        .card p { font-size: 0.95em; color: #a0a5b0; white-space: pre-line; line-height: 1.5; }
        
        .buy-btn { 
            background: transparent; 
            color: #fff; 
            border: 1px solid var(--accent); 
            padding: 14px; 
            width: 100%; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 15px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .buy-btn:hover { 
            background: var(--accent); 
            color: #000; 
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .owner-only { display: none; }
        .admin-box { 
            background: rgba(15, 17, 26, 0.95); 
            padding: 30px; 
            border: 1px solid var(--card-border); 
            border-radius: 20px; 
            margin-top: 40px; 
            backdrop-filter: blur(20px);
        }
        
        input, textarea, select { 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            border-radius: 10px; 
            border: 1px solid var(--card-border); 
            background: rgba(255,255,255,0.02); 
            color: #fff; 
            box-sizing: border-box; 
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--accent);
            outline: none;
            background: rgba(255,255,255,0.05);
        }

        .social-btn { 
            padding: 12px 28px; 
            text-decoration: none; 
            color: white; 
            border-radius: 12px; 
            font-weight: bold; 
            display: inline-block; 
            margin: 8px; 
        }
        .social-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        #orderModal { 
            display: none; 
            position: fixed; 
            z-index: 10001; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(5, 6, 10, 0.9); 
            backdrop-filter: blur(15px);
            justify-content: center; align-items: center; 
        }
        .modal-content { 
            background: #0f111a; 
            padding: 35px; 
            border-radius: 24px; 
            border: 1px solid var(--card-border); 
            width: 90%; max-width: 450px; 
            text-align: center; 
        }
        .rev-card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--accent); 
            text-align: left; 
        }

        #imageOverlay { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; }
        #secretSpot { position: fixed; bottom: 0; right: 0; width: 30px; height: 30px; cursor: pointer; z-index: 9999; }
    </style>
</head>
<body>

<div id="orderModal">
    <div class="modal-content">
        <h3 id="modalTitle" style="color: var(--accent); font-size: 1.6em; margin-top: 0;"></h3>
        <p id="modalPrice" style="color: var(--gold); font-size: 1.2em; font-weight: bold;"></p>
        <textarea id="orderNote" rows="4" placeholder="ඔයාට අවශ්‍ය විස්තර මෙතන ලියන්න..."></textarea>
        <button onclick="sendWhatsApp()" style="background: var(--wa); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.05em;">🛒 SEND ORDER VIA WHATSAPP</button>
        <button onclick="closeModal()" style="background: none; color: #606570; border: none; margin-top: 15px; cursor: pointer; font-weight: 600;">Cancel</button>
    </div>
</div>

<div id="imageOverlay" onclick="this.style.display='none'"><img id="fullImage" src="" style="max-width:90%; border-radius: 10px;"></div>
<div id="secretSpot" onclick="login()"></div>

<div class="topbar">
    <div style="display:flex; align-items:center; gap:12px;">
        <img src="https://lh3.googleusercontent.com/d/12tUVHak4M3bJmr3BwXRjyC-wo_UymID3" 
             style="width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--accent);">
        <span style="font-weight:bold; color:#fff; letter-spacing: 1px; font-size:1.1em;">SAN GRAPHICS PRO</span>
    </div>
    <div id="ownerIndicator" style="font-size: 0.75em; color: #404550; font-weight: bold; letter-spacing: 1px;">V2 PREMIUM</div>
</div>

<div class="header">
    <h1>SAN Graphic Store</h1>
    <p>Professional Multimedia & Digital Solutions</p>
</div>

<nav>
    <button onclick="toggleTab('home')">🏠 HOME</button>
    <button onclick="toggleTab('reviews')">⭐ REVIEWS</button>
    <button onclick="toggleTab('contact')">📩 CONTACT & PAY</button>
</nav>

<div id="home" class="tab-section active">
    <div class="home-tabs">
        <div class="img-tab active-sub" id="btn-video" onclick="toggleSubTab('video')"><img src="https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?w=400"><span>Video Editing</span></div>
        <div class="img-tab" id="btn-graphic" onclick="toggleSubTab('graphic')"><img src="https://images.unsplash.com/photo-1626785774573-4b799315345d?w=400"><span>Graphic Designing</span></div>
        <div class="img-tab" id="btn-ai" onclick="toggleSubTab('ai')"><img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?w=400"><span>AI Web Development</span></div>
        <div class="img-tab" id="btn-office" onclick="toggleSubTab('office')"><img src="https://images.unsplash.com/photo-1497215728101-856f4ea42174?w=400"><span>Office Works</span></div>
    </div>
    <div id="video" class="sub-content"><div class="cards-grid" id="video-list"></div></div>
    <div id="graphic" class="sub-content" style="display:none;"><div class="cards-grid" id="graphic-list"></div></div>
    <div id="ai" class="sub-content" style="display:none;"><div class="cards-grid" id="ai-list"></div></div>
    <div id="office" class="sub-content" style="display:none;"><div class="cards-grid" id="office-list"></div></div>

    <div class="admin-box owner-only">
        <h3 style="color: gold; margin-top: 0;">+ Add New Service</h3>
        <input type="text" id="gigImg" placeholder="Image/Video URL">
        <input type="text" id="gigTitle" placeholder="Service Name">
        <textarea id="gigPrice" rows="2" placeholder="Price"></textarea>
        <textarea id="gigDesc" rows="4" placeholder="Description"></textarea>
        <select id="gigCategory">
            <option value="video">Video Editing</option>
            <option value="graphic">Graphic Designing</option>
            <option value="ai">AI Web Development</option>
            <option value="office">Office Works</option>
        </select>
        <button onclick="addNewGig()" style="background:var(--accent); color:black; font-weight:bold; width:100%; padding:14px; border:none; border-radius:10px; cursor:pointer;">ADD GIG</button>
    </div>
</div>

<div id="reviews" class="tab-section">
    <div class="admin-box" style="margin-top:0;">
        <h3 style="margin-top:0;">Submit Feedback</h3>
        <input type="text" id="revName" placeholder="Your Name">
        <select id="revStars"><option value="⭐⭐⭐⭐⭐">5 Stars</option><option value="⭐⭐⭐⭐">4 Stars</option></select>
        <textarea id="revMsg" rows="3" placeholder="Message"></textarea>
        <button onclick="submitReview()" style="background:var(--accent); color:black; width:100%; padding:14px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">POST REVIEW</button>
    </div>
    <div id="review-list" style="margin-top: 30px;"></div>
</div>

<div id="contact" class="tab-section">
    <div class="admin-box" style="text-align: center; margin-top:0;">
        <h2 style="margin-top:0;">Connect With Us</h2>
        <div id="social-display"></div>
        
        <div class="owner-only" style="margin-top: 20px;">
            <input type="text" id="setFB" placeholder="Facebook URL">
            <input type="text" id="setYT" placeholder="YouTube URL">
            <input type="text" id="setTG" placeholder="Telegram URL">
            <button onclick="saveSettings()" style="background:var(--accent); color:black; padding:12px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Update Social Links</button>
        </div>

        <hr style="border:0.5px solid var(--card-border); margin:40px 0;">
        <h2 style="color: var(--gold);">Bank Details</h2>
        <div id="bank-display" style="border: 1px dashed var(--gold); padding: 25px; border-radius: 16px; background: rgba(0,0,0,0.3); white-space: pre-line; display: inline-block; text-align: left; min-width: 300px; margin-bottom: 20px; line-height: 1.6;"></div>
        
        <div class="owner-only">
            <textarea id="setBank" rows="6" placeholder="Enter Bank Details Here..."></textarea>
            <button onclick="saveSettings()" style="background:gold; color:black; font-weight:bold; width:100%; padding:14px; border:none; border-radius:10px; cursor:pointer;">SAVE BANK DETAILS</button>
        </div>
    </div>
</div>

<script>
    // --- ANTI-INSPECT & ANTI-COPY PROTECTION ---
    document.addEventListener('contextmenu', event => event.preventDefault()); // Disable right click
    
    document.onkeydown = function(e) {
        // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
        if (e.keyCode == 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
            (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };

    // Advanced DevTools Detection Loop
    setInterval(function() {
        const before = new Date().getTime();
        debugger; 
        const after = new Date().getTime();
        if (after - before > 100) {
            document.querySelector('body').innerHTML = '<div style="text-align:center;margin-top:20%;font-size:2em;color:red;font-weight:bold;">Access Denied! Developer Tools Detected.</div>';
        }
    }, 1000);

    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDtxtI0W6R4eZCdPJrzvEosBEGl8EGC60c",
      authDomain: "san-graphic-store.firebaseapp.com",
      databaseURL: "https://san-graphic-store-default-rtdb.firebaseio.com",
      projectId: "san-graphic-store",
      storageBucket: "san-graphic-store.firebasestorage.app",
      messagingSenderId: "424910899617",
      appId: "1:424910899617:web:00d369f925bb3b906fa3e0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let isOwner = false;
    let tempOrderData = {};
    const MY_NUMBER = "94714980024";

    function toggleTab(id) {
        document.querySelectorAll('.tab-section').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function toggleSubTab(id) {
        document.querySelectorAll('.sub-content').forEach(c => c.style.display = 'none');
        document.querySelectorAll('.img-tab').forEach(b => b.classList.remove('active-sub'));
        document.getElementById(id).style.display = 'block';
        document.getElementById('btn-' + id).classList.add('active-sub');
    }

    function loadData() {
        ['video', 'graphic', 'ai', 'office'].forEach(cat => {
            db.ref('gigs/' + cat).on('value', snap => {
                const list = document.getElementById(cat + '-list');
                list.innerHTML = '';
                snap.forEach(child => {
                    const d = child.val();
                    const key = child.key;
                    const media = d.url.match(/\.(mp4|webm)$/) ? `<video src="${d.url}" controls></video>` : `<img src="${d.url}" onclick="showImage('${d.url}')">`;
                    list.innerHTML += `
                        <div class="card">
                            <div id="media-container-${key}">${media}</div>
                            <div id="view-${key}">
                                <h3>${d.title}</h3>
                                <span class="price-tag">${d.price}</span>
                                <p>${d.desc}</p>
                            </div>
                            <button class="buy-btn" onclick="openOrderModal('${d.title}', '${d.price.replace(/\n/g, ' ')}')">🛒 BUY NOW</button>
                            <div class="owner-only" style="display:${isOwner?'block':'none'}; margin-top:15px;">
                                <button onclick="editGig('${cat}','${key}', '${d.url}')" id="eb-${key}" style="background:#3498db; color:white; border:none; padding:7px 14px; border-radius:6px; cursor:pointer; font-weight:bold;">Edit</button>
                                <button onclick="deleteGig('${cat}','${key}')" style="background:red; color:white; border:none; padding:7px 14px; border-radius:6px; cursor:pointer; font-weight:bold;">Delete</button>
                            </div>
                        </div>`;
                });
            });
        });
    }

    function editGig(cat, key, currentUrl) {
        const mediaContainer = document.getElementById(`media-container-${key}`);
        const titleEl = document.querySelector(`#view-${key} h3`);
        const priceEl = document.querySelector(`#view-${key} .price-tag`);
        const descEl = document.querySelector(`#view-${key} p`);
        const btn = document.getElementById(`eb-${key}`);

        if (btn.innerText === "Edit") {
            // Store the original media display in case they cancel or it re-renders
            mediaContainer.innerHTML = `<input type="text" id="edit-u-${key}" value="${currentUrl}" placeholder="Image or Video URL">`;
            titleEl.innerHTML = `<input type="text" id="edit-t-${key}" value="${titleEl.innerText}">`;
            priceEl.innerHTML = `<textarea id="edit-p-${key}" rows="2">${priceEl.innerText}</textarea>`;
            descEl.innerHTML = `<textarea id="edit-d-${key}" rows="4">${descEl.innerText}</textarea>`;
            btn.innerText = "SAVE";
            btn.style.background = "#2ecc71";
        } else {
            const upData = {
                url: document.getElementById(`edit-u-${key}`).value,
                title: document.getElementById(`edit-t-${key}`).value,
                price: document.getElementById(`edit-p-${key}`).value,
                desc: document.getElementById(`edit-d-${key}`).value
            };
            db.ref(`gigs/${cat}/${key}`).update(upData).then(() => { 
                alert("Updated Successfully!"); 
                loadData(); 
            });
        }
    }

    function saveSettings() {
        const s = {
            fb: document.getElementById('setFB').value,
            yt: document.getElementById('setYT').value,
            tg: document.getElementById('setTG').value,
            bank: document.getElementById('setBank').value
        };
        db.ref('siteSettings').set(s).then(() => alert("All Settings Saved!"));
    }

    function loadSettings() {
        db.ref('siteSettings').on('value', snap => {
            const s = snap.val(); if(!s) return;
            if(document.getElementById('setFB')) document.getElementById('setFB').value = s.fb || '';
            if(document.getElementById('setYT')) document.getElementById('setYT').value = s.yt || '';
            if(document.getElementById('setTG')) document.getElementById('setTG').value = s.tg || '';
            if(document.getElementById('setBank')) document.getElementById('setBank').value = s.bank || '';
            document.getElementById('social-display').innerHTML = `
                <a href="${s.fb}" target="_blank" class="social-btn" style="background:#1877F2;">Facebook</a>
                <a href="${s.yt}" target="_blank" class="social-btn" style="background:#FF0000;">YouTube</a>
                <a href="${s.tg}" target="_blank" class="social-btn" style="background:#0088cc;">Telegram</a>
                <a href="https://wa.me/${MY_NUMBER}" target="_blank" class="social-btn" style="background:#25D366;">WhatsApp</a>`;
            document.getElementById('bank-display').innerText = s.bank || 'Bank details not set yet.';
        });
    }

    function openOrderModal(title, price) {
        tempOrderData = { title, price };
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalPrice').innerText = price;
        document.getElementById('orderModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }
    function sendWhatsApp() {
        const note = document.getElementById('orderNote').value || "No note.";
        const msg = `Order: ${tempOrderData.title}\nPrice: ${tempOrderData.price}\nNote: ${note}`;
        window.open(`https://wa.me/${MY_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        closeModal();
    }
    function login() {
        if(prompt("Admin Key:") === "Sahas 200834300066/0852") {
            isOwner = true;
            document.querySelectorAll('.owner-only').forEach(el => el.style.display = 'block');
            document.getElementById('ownerIndicator').innerText = "ADMIN ACTIVE";
            loadData(); loadReviews(); loadSettings();
        }
    }
    function submitReview() {
        const name = document.getElementById('revName').value;
        const stars = document.getElementById('revStars').value;
        const msg = document.getElementById('revMsg').value;
        if(name && msg) db.ref('reviews').push({name, stars, msg}).then(() => alert("Review Posted!"));
    }
    function loadReviews() {
        db.ref('reviews').on('value', snap => {
            const list = document.getElementById('review-list'); list.innerHTML = '';
            snap.forEach(child => {
                const r = child.val();
                list.innerHTML += `<div class="rev-card"><b style="color:var(--accent)">${r.name}</b><br><small style="color:gold">${r.stars}</small><p>${r.msg}</p>${isOwner?`<button onclick="db.ref('reviews/${child.key}').remove()" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">Delete</button>`:''}</div>`;
            });
        });
    }
    function addNewGig() {
        const cat = document.getElementById('gigCategory').value;
        const data = { url: document.getElementById('gigImg').value, title: document.getElementById('gigTitle').value, price: document.getElementById('gigPrice').value, desc: document.getElementById('gigDesc').value };
        db.ref('gigs/' + cat).push(data).then(() => alert("Added!"));
    }
    function deleteGig(cat, key) { if(confirm("Delete?")) db.ref(`gigs/${cat}/${key}`).remove(); }
    function showImage(src) { document.getElementById('fullImage').src = src; document.getElementById('imageOverlay').style.display = 'flex'; }
    window.onload = () => { loadData(); loadSettings(); loadReviews(); };
    window.addEventListener('keydown', (e) => { if(e.key.toLowerCase() === 'l') login(); });
</script>
</body>
</html>
